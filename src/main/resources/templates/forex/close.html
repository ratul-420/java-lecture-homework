<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex - Close position')}"></head>
<body class="is-preload">
<div id="wrapper">
    <div id="main">
        <div class="inner">
            <header id="header"><a href="/" class="logo"><strong>FXWorks</strong> Trading Solutions</a></header>

            <section>
                <header class="major"><h2>Close position</h2></header>
                <p>Enter the Trade ID. The trade closes at the market price.</p>

                <form method="post" action="/forex/close">
                    <div class="fields">
                        <div class="field half">
                            <label>Trade ID</label>
                            <input type="number" name="tradeId" min="1" required />
                        </div>
                    </div>
                    <ul class="actions">
                        <li><input type="submit" value="Close position" class="primary" /></li>
                    </ul>
                </form>

                <p th:if="${error}" th:text="${error}" style="color:red;"></p>
                <p th:if="${result}" th:text="${result}" style="color:green;"></p>
            </section>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
