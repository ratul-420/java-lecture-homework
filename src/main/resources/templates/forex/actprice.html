<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex - Actual price')}"></head>
<body class="is-preload">
<div id="wrapper">
    <div id="main">
        <div class="inner">
            <header id="header"><a href="/" class="logo"><strong>FXWorks</strong> Trading Solutions</a></header>

            <section>
                <header class="major"><h2>Actual price</h2></header>

                <form method="get" action="/forex/actprice">
                    <div class="fields">
                        <div class="field half">
                            <select name="instrument">
                                <option th:each="i : ${instruments}" th:value="${i}" th:text="${i}"
                                        th:selected="${i == selected}"></option>
                            </select>
                        </div>
                    </div>
                    <ul class="actions">
                        <li><input type="submit" value="Show price" class="primary" /></li>
                    </ul>
                </form>

                <p th:if="${error}" th:text="${error}" style="color:red;"></p>

                <div class="table-wrapper" th:if="${bid}">
                    <table>
                        <tbody>
                        <tr><td><strong>Instrument</strong></td><td th:text="${selected}"></td></tr>
                        <tr><td><strong>Time</strong></td><td th:text="${time}"></td></tr>
                        <tr><td><strong>Bid</strong></td><td th:text="${bid}"></td></tr>
                        <tr><td><strong>Ask</strong></td><td th:text="${ask}"></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
