<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forex - Historical prices')}"></head>
<body class="is-preload">
<div id="wrapper">
    <div id="main">
        <div class="inner">
            <header id="header"><a href="/" class="logo"><strong>FXWorks</strong> Trading Solutions</a></header>

            <section>
                <header class="major"><h2>Historical prices</h2></header>

                <form method="get" action="/forex/histprice">
                    <div class="fields">
                        <div class="field half">
                            <label for="instrument">Instrument</label>
                            <select name="instrument" id="instrument">
                                <option th:each="i : ${instruments}" th:value="${i}" th:text="${i}"
                                        th:selected="${i == selected}"></option>
                            </select>
                        </div>
                        <div class="field half">
                            <label for="granularity">Granularity</label>
                            <select name="granularity" id="granularity">
                                <option th:each="g : ${granularities}" th:value="${g}" th:text="${g}"
                                        th:selected="${g == selectedGranularity}"></option>
                            </select>
                        </div>
                    </div>
                    <ul class="actions">
                        <li><input type="submit" value="Show last 10 prices" class="primary" /></li>
                    </ul>
                </form>

                <p th:if="${error}" th:text="${error}" style="color:red;"></p>

                <div class="table-wrapper" th:if="${rows}">
                    <table>
                        <thead>
                        <tr><th>Time</th><th>Close (mid)</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${rows}">
                            <td th:text="${r.time()}"></td>
                            <td th:text="${r.close()}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <footer th:replace="~{fragments/layout :: footer}"></footer>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: sidebar}"></div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
